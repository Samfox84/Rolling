# Runs the studio's tests on every change (and on Dependabot's update pull requests), and checks the building blocks
# for known security problems.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: npm install --no-audit --no-fund
      - run: npm test
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Known security problems in the studio's building blocks
        run: npm install --package-lock-only --no-audit --no-fund && npm audit --omit=dev --audit-level=high
      - name: Known security problems in Rolling Desk's building blocks
        working-directory: desk
        run: npm install --package-lock-only --no-audit --no-fund && npm audit --omit=dev --audit-level=high
